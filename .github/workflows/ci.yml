name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: profit-pilot-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: profit-pilot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  database:
    name: Database migrations and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profit_pilot
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profit_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/profit_pilot
      DATABASE_INTEGRATION_URL: postgresql://profit_pilot_integration:integration_test_only@127.0.0.1:5432/profit_pilot
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create non-superuser application role
        run: |
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=profit_pilot --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE profit_pilot_integration
            LOGIN
            PASSWORD 'integration_test_only'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOINHERIT;
          GRANT CONNECT ON DATABASE profit_pilot TO profit_pilot_integration;
          GRANT USAGE ON SCHEMA public TO profit_pilot_integration;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO profit_pilot_integration;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO profit_pilot_integration;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE ON TYPES TO profit_pilot_integration;
          SQL
      - run: pnpm --filter @profit-pilot/db db:migrate
      - run: pnpm --filter @profit-pilot/db test:integration

  infrastructure:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
