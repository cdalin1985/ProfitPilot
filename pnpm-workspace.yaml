  - "fast-uri@3.1.5||4.1.2"
  - hono@4.12.34
  - ip-address@10.3.1
  - js-yaml@4.3.1
  - nanoid@3.3.18
  - next@16.2.12
  - undici@7.29.0

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080
