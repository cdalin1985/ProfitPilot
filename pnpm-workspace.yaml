packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 10080

overrides:
  "@hono/node-server@<2.0.10": 2.0.10
  "brace-expansion@<=5.0.8": 5.0.9
  "esbuild@<=0.24.2": 0.25.12
  "find-my-way@<=9.6.0": 9.7.0
  "nanoid@3.3.16": 3.3.17
  postcss: 8.5.23
  sharp: 0.35.0
  "undici@7.28.0": 7.29.0

catalog:
  "@opentelemetry/api": "1.9.1"
  "drizzle-orm": "0.45.2"
  "postgres": "3.4.9"
  "tsx": "4.23.1"
  "typescript": "5.9.3"
  "vitest": "4.1.10"
  "zod": "4.4.3"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

minimumReleaseAgeExclude:
  - "@next/*"
  - brace-expansion@5.0.8
  - eslint-config-next@16.2.12
  - find-my-way@9.7.0
  - next@16.2.12

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080
